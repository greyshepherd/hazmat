name: Bug report
description: Hazmat did not do what it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. The status line, the
        banner, the Revert pane, and the Resolved pane each say what Hazmat
        last wrote — what they show is usually the fastest route to a cause.

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: From the Apple menu, choose About This Mac.
      placeholder: e.g. macOS 15.6.1
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: e.g. MacBook Pro (M4 Pro)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What you did, and what you expected
      description: Start from the state the window was in when you began.
      placeholder: |
        e.g. Selected the work profile, pressed Apply, expected the hosts file
        to carry the resolved block.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What happened instead
    validations:
      required: true

  - type: textarea
    id: shown
    attributes:
      label: What Hazmat showed
      description: The status line, the banner, the Revert pane, and the Resolved pane as text (Text view). Redact anything you do not want to publish.
    validations:
      required: false

  - type: checkboxes
    id: searched
    attributes:
      label: Before filing
      options:
        - label: I have searched the existing issues for this problem
    validations:
      required: true
